<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA Technic Garage - Giriş</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
    }

    .login-box {
      width: 400px;
      max-width: 90%;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #16803c;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>EA Technic Garage</h1>

    <div class="subtitle">
      Hesabınıza giriş yapın
    </div>

    <form id="loginForm">

      <label for="email">E-posta</label>
      <input
        type="email"
        id="email"
        placeholder="E-posta adresiniz"
        required
      >

      <label for="password">Şifre</label>
      <input
        type="password"
        id="password"
        placeholder="Şifreniz"
        required
      >

      <button type="submit" id="loginButton">
        Giriş Yap
      </button>

    </form>

    <div id="message"></div>

  </div>

  <script>

    // ==========================================
    // SUPABASE BİLGİLERİ
    // ==========================================

    const SUPABASE_URL = "https://hiizlkcrltedvjkgtfzl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_h6P4jI0L4bfeQrLsUZHfCw_iDEjTW6A";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      )


    // ==========================================
    // GİRİŞ İŞLEMİ
    // ==========================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "";
      message.className = "";

      loginButton.disabled = true;
      loginButton.textContent = "Giriş yapılıyor...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        console.error(error);

        message.textContent =
          "Giriş yapılamadı: " + error.message;

        message.className = "error";

        loginButton.disabled = false;
        loginButton.textContent = "Giriş Yap";

        return;
      }

      message.textContent =
        "Giriş başarılı! Yönlendiriliyorsunuz...";

      message.className = "success";

      setTimeout(function() {

        window.location.href = "index.html";

      }, 1000);

    });

  </script>

</body>
</html>
