<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EA Technic Garage - Giriş</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
    }

    .login-box {
      width: 400px;
      max-width: 90%;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #16803c;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .register a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .register a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>EA Technic Garage</h1>

    <div class="subtitle">
      Hesabınıza giriş yapın
    </div>

    <form id="loginForm">

      <label for="email">E-posta</label>

      <input
        type="email"
        id="email"
        placeholder="E-posta adresiniz"
        autocomplete="email"
        required
      >

      <label for="password">Şifre</label>

      <input
        type="password"
        id="password"
        placeholder="Şifreniz"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Giriş Yap
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      Hesabınız yok mu?
      <a href="kayit.html">Kayıt Ol</a>
    </div>

  </div>


  <script>

    // ==========================================
    // SUPABASE BİLGİLERİ
    // ==========================================

    const SUPABASE_URL =
      "https://hiizlkcrltedvjkgtfzl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_h6P4jI0L4bfeQrLsUZHfCw_iDEjTW6A";


    // ==========================================
    // SUPABASE BAĞLANTISI
    // ==========================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // HTML ELEMANLARI
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    // ==========================================
    // GİRİŞ İŞLEMİ
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        // Mesajı temizle
        message.textContent = "";
        message.className = "";


        // Butonu kilitle
        loginButton.disabled = true;
        loginButton.textContent =
          "Giriş yapılıyor...";


        try {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });


          // Hata varsa
          if (error) {

            console.error(
              "Supabase giriş hatası:",
              error
            );

            message.textContent =
              "Giriş yapılamadı: " +
              error.message;

            message.className = "error";

            loginButton.disabled = false;
            loginButton.textContent =
              "Giriş Yap";

            return;
          }


          // Giriş başarılı
          console.log(
            "Giriş başarılı:",
            data
          );

          message.textContent =
            "Giriş başarılı! Ana sayfaya yönlendiriliyorsunuz...";

          message.className = "success";


          // Ana sayfaya gönder
          setTimeout(function () {

            window.location.href =
              "index.html";

          }, 1000);


        } catch (error) {

          console.error(
            "Beklenmeyen hata:",
            error
          );

          message.textContent =
            "Bağlantı hatası oluştu. Lütfen tekrar deneyin.";

          message.className = "error";

          loginButton.disabled = false;
          loginButton.textContent =
            "Giriş Yap";
        }

      }
    );

  </script>

</body>
</html>
