<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA Technic Garage - Kayıt Ol</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
    }

    .box {
      width: 420px;
      max-width: 92%;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      line-height: 1.5;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #16803c;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>EA Technic Garage</h1>

  <div class="subtitle">
    Müşteri hesabı oluştur
  </div>

  <form id="registerForm">

    <label for="name">Ad Soyad</label>
    <input
      id="name"
      type="text"
      placeholder="Adınız ve soyadınız"
      required
    >

    <label for="email">E-posta</label>
    <input
      id="email"
      type="email"
      placeholder="E-posta adresiniz"
      required
    >

    <label for="password">Şifre</label>
    <input
      id="password"
      type="password"
      placeholder="En az 6 karakter"
      minlength="6"
      required
    >

    <label for="password2">Şifre Tekrar</label>
    <input
      id="password2"
      type="password"
      placeholder="Şifrenizi tekrar yazın"
      minlength="6"
      required
    >

    <button id="registerButton" type="submit">
      Hesap Oluştur
    </button>

  </form>

  <div id="message"></div>

  <div class="login">
    Zaten hesabınız var mı?
    <a href="giris.html">Giriş Yap</a>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://hiizlkcrltevjdkgftzl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_h6P4jI0L4bfeQrLsUZHfCw_iDEjTW6A";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form =
document.getElementById("registerForm");

const button =
document.getElementById("registerButton");

const message =
document.getElementById("message");


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const name =
  document.getElementById("name").value.trim();

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const password2 =
  document.getElementById("password2").value;


  if (password !== password2) {

    message.textContent =
    "Şifreler birbirine eşleşmiyor.";

    message.className = "error";

    return;
  }


  button.disabled = true;
  button.textContent =
  "Hesap oluşturuluyor...";


  const { data, error } =
  await supabaseClient.auth.signUp({

    email: email,

    password: password,

    options: {

      data: {
        full_name: name,
        account_type: "customer"
      }

    }

  });


  if (error) {

    console.error(error);

    message.textContent =
    "Kayıt başarısız: " + error.message;

    message.className = "error";

    button.disabled = false;
    button.textContent =
    "Hesap Oluştur";

    return;
  }


  message.textContent =
  "Hesabınız oluşturuldu. E-posta adresinizi kontrol edin.";

  message.className = "success";

  button.disabled = false;
  button.textContent =
  "Hesap Oluştur";

});

</script>

</body>
</html>
