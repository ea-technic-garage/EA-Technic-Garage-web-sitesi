<body>

<div class="box">

  <h1>EA Technic Garage</h1>

  <div class="subtitle">
    Müşteri hesabı oluştur
  </div>

  <form id="registerForm">

    <label for="name">Ad Soyad</label>
    <input
      id="name"
      type="text"
      placeholder="Adınız ve soyadınız"
      required
    >

    <label for="email">E-posta</label>
    <input
      id="email"
      type="email"
      placeholder="E-posta adresiniz"
      required
    >

    <label for="password">Şifre</label>
    <input
      id="password"
      type="password"
      placeholder="En az 6 karakter"
      minlength="6"
      required
    >

    <label for="password2">Şifre Tekrar</label>
    <input
      id="password2"
      type="password"
      placeholder="Şifrenizi tekrar yazın"
      minlength="6"
      required
    >

    <button id="registerButton" type="submit">
      Hesap Oluştur
    </button>

  </form>

  <div id="message"></div>

  <div class="login">

  </div>

<script>
const SUPABASE_URL =
  "https://hiizlkcrltedvjkgtfzl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_h6P4jI0L4bfeQrLsUZHfCw_iDEjTW6A";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const form =
  document.getElementById("registerForm");

const button =
  document.getElementById("registerButton");

const message =
  document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const password2 =
    document.getElementById("password2").value;

  message.textContent = "";
  message.className = "";

  if (password !== password2) {
    message.textContent =
      "Şifreler birbirine eşleşmiyor.";

    message.className = "error";
    return;
  }

  if (password.length < 6) {
    message.textContent =
      "Şifre en az 6 karakter olmalıdır.";

    message.className = "error";
    return;
  }

  button.disabled = true;
  button.textContent =
    "Hesap oluşturuluyor...";

  try {

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          emailRedirectTo:
            "https://ea-technic-garage.github.io/EA-Technic-Garage-web-sitesi/EA-Technic-Garage/giris.html",

          data: {
            full_name: name,
            account_type: "customer"
          }

        }

      });

    if (error) {
      console.error("Supabase kayıt hatası:", error);

      message.textContent =
        "Kayıt başarısız: " + error.message;

      message.className = "error";

      button.disabled = false;
      button.textContent =
        "Hesap Oluştur";

      return;
    }

    message.textContent =
      "Hesabınız oluşturuldu! E-posta adresinize gelen doğrulama bağlantısına tıklayın.";

    message.className = "success";

    form.reset();

    button.disabled = false;
    button.textContent =
      "Hesap Oluştur";

  } catch (err) {

    console.error("Bağlantı hatası:", err);

    message.textContent =
      "Sunucuya bağlanılamadı. Lütfen internet bağlantınızı kontrol edip tekrar deneyin.";

    message.className = "error";

    button.disabled = false;
    button.textContent =
      "Hesap Oluştur";
  }

});
</script>
