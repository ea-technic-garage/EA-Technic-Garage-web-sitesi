<head>

  <style>

<body>

  <div class="register-box">

    <div class="logo">

      <a href="index.html">
        EA TECHNIC
      </a>

      <span>
        GARAGE
      </span>

    </div>


    <h1>
      Kayıt Ol
    </h1>


    <div class="subtitle">
      EA Technic Garage hesabınızı oluşturun
    </div>


    <form id="registerForm">


      <label for="name">
        Ad Soyad
      </label>

      <input
        type="text"
        id="name"
        placeholder="Adınız ve soyadınız"
        autocomplete="name"
        required
      >


      <label for="email">
        E-posta
      </label>

      <input
        type="email"
        id="email"
        placeholder="E-posta adresiniz"
        autocomplete="email"
        required
      >


      <label for="password">
        Şifre
      </label>

      <input
        type="password"
        id="password"
        placeholder="En az 6 karakter"
        autocomplete="new-password"
        minlength="6"
        required
      >


      <label for="password2">
        Şifre Tekrar
      </label>

      <input
        type="password"
        id="password2"
        placeholder="Şifrenizi tekrar yazın"
        autocomplete="new-password"
        minlength="6"
        required
      >


      <button
        type="submit"
        id="registerButton"
      >
        Kayıt Ol
      </button>


    </form>


    <div id="message"></div>


    <div class="links">

      Zaten hesabınız var mı?

      <a href="giris.html">
        Giriş Yap
      </a>

    </div>


    <a
      class="back"
      href="index.html"
    >
      ← Ana sayfaya dön
    </a>


  </div>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://hiizlkcrltedvjkgtfzl.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_h6P4jI0L4bfeQrLsUZHfCw_iDEjTW6A";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ELEMENTLER
    // ==========================================

    const registerForm =
      document.getElementById(
        "registerForm"
      );


    const registerButton =
      document.getElementById(
        "registerButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    // ==========================================
    // KAYIT
    // ==========================================

    registerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const name =
          document
            .getElementById("name")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const password2 =
          document
            .getElementById("password2")
            .value;


        message.textContent = "";

        message.className = "";


        // ======================================
        // ŞİFRE KONTROLÜ
        // ======================================

        if (password !== password2) {

          message.textContent =
            "Şifreler aynı değil.";

          message.className =
            "error";

          return;
        }


        if (password.length < 6) {

          message.textContent =
            "Şifre en az 6 karakter olmalıdır.";

          message.className =
            "error";

          return;
        }


        // ======================================
        // BUTON
        // ======================================

        registerButton.disabled = true;

        registerButton.textContent =
          "Kayıt oluşturuluyor...";


        try {


          // ====================================
          // SUPABASE KAYIT
          // ====================================

          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email: email,

              password: password,

              options: {

                // E-POSTA DOĞRULAMASINDAN
                // SONRA BURAYA GELECEK

                emailRedirectTo:
                  "https://ea-technic-garage.github.io/EA-Technic-Garage-web-sitesi/dogrulama.html",


                // KULLANICI BİLGİSİ

                data: {

                  full_name: name

                }

              }

            });


          // ====================================
          // HATA
          // ====================================

          if (error) {

            console.error(error);


            message.textContent =
              "Kayıt yapılamadı: " +
              error.message;


            message.className =
              "error";


            registerButton.disabled =
              false;


            registerButton.textContent =
              "Kayıt Ol";


            return;
          }


          // ====================================
          // BAŞARILI
          // ====================================

          message.textContent =
            "Kayıt başarılı! E-posta adresinize doğrulama bağlantısı gönderildi.";


          message.className =
            "success";


          registerButton.disabled =
            true;


          registerButton.textContent =
            "E-posta Bekleniyor";


        }


        catch (error) {

          console.error(error);


          message.textContent =
            "Bağlantı sırasında bir hata oluştu. Lütfen tekrar deneyin.";


          message.className =
            "error";


          registerButton.disabled =
            false;


          registerButton.textContent =
            "Kayıt Ol";

        }

      }
    );

  </script>

</body>
</html>
