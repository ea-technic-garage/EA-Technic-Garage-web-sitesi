<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EA Technic Garage | Yönetim</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<aside>
  <h2>EA TECHNIC</h2>
  <p>GARAGE • YÖNETİM</p>
  <a class="active" href="admin.html">📦 Ürünler</a>
  <a href="#" onclick="soon(event)">🚗 Araçlar</a>
  <a href="#" onclick="soon(event)">🛒 Siparişler</a>
  <a href="#" onclick="soon(event)">👥 Müşteriler</a>
  <a href="#" onclick="soon(event)">⚙️ Ayarlar</a>
  <a class="store" href="../index.html">← Mağazaya dön</a>
</aside>

<main>
<header>
  <div>
    <small>EA TECHNIC GARAGE</small>
    <h1>Ürün Yönetimi</h1>
    <p>Parçalarını buradan ekle, düzenle ve sil.</p>
  </div>
  <button onclick="openForm()">+ Yeni Ürün</button>
</header>

<section class="stats">
  <div><span>Toplam Ürün</span><b id="count">0</b></div>
  <div><span>Toplam Stok</span><b id="stock">0</b></div>
  <div><span>Ortalama Fiyat</span><b id="avg">0 ₺</b></div>
</section>

<section class="panel">
  <div class="panelHead">
    <h2>Ürünler</h2>
    <input id="search" placeholder="Ürün veya marka ara..." oninput="render()">
  </div>
  <table>
    <thead><tr><th>Ürün</th><th>Marka</th><th>Kategori</th><th>Fiyat</th><th>Stok</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</section>
</main>

<div id="modal" class="modal">
  <div class="box">
    <button class="x" onclick="closeForm()">×</button>
    <small>ÜRÜN BİLGİLERİ</small>
    <h2 id="title">Yeni Ürün Ekle</h2>
    <form onsubmit="save(event)">
      <input type="hidden" id="id">
      <label>Ürün adı<input id="name" required placeholder="Örn. Ön Fren Balatası"></label>
      <div class="two">
        <label>Marka<input id="brand" required placeholder="Bosch"></label>
        <label>Kategori<select id="category">
          <option>Motor</option><option>Fren</option><option>Filtre</option>
          <option>Elektrik</option><option>Debriyaj</option><option>Süspansiyon</option>
        </select></label>
      </div>
      <div class="two">
        <label>Fiyat (₺)<input id="price" type="number" step="0.01" min="0" required></label>
        <label>Stok<input id="stockInput" type="number" min="0" required></label>
      </div>
      <label>Uyumluluk / kısa açıklama<input id="fit" placeholder="BMW 3 Serisi 2020-2024"></label>
      <label>Görsel simgesi<input id="image" maxlength="4" placeholder="🔧"></label>
      <div class="actions"><button type="button" class="cancel" onclick="closeForm()">İptal</button><button>Ürünü Kaydet</button></div>
    </form>
  </div>
</div>
<div id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
